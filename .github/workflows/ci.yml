name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      # The swc transform used by jest strips types without checking them, so
      # this is the only step that actually runs the TypeScript compiler over
      # the repo. Do not drop it.
      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test:ci

      # Bundling is not type-checked (ts-loader runs with transpileOnly), so
      # this catches module-resolution and loader problems that the Typecheck
      # step above cannot see.
      - name: Build
        run: yarn build-all

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
